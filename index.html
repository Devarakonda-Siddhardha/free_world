<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Terra Haven â€” Autonomous Machine Playing by the Lake (Liquid AI LFM3)</title>
  <!-- Three.js and OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    header {
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand-title {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #4ade80, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
    }
    .main-container { position: fixed; inset: 0; }
    #canvas-container { width: 100%; height: 100%; }

    /* Floating View Mode Selector */
    .view-selector {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 4px;
      gap: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .view-btn.active {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    /* Floating Live Action Pill */
    .agent-status-pill {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    /* Floating Live Thought Banner */
    .thought-banner {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.55);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f8fafc;
      box-shadow: 0 4px 18px rgba(0,0,0,0.55);
      max-width: 90vw;
      text-align: center;
      backdrop-filter: blur(10px);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .thought-icon { font-size: 13px; }
    .thought-label { color: var(--accent-gold); font-weight: 700; white-space: nowrap; }
    .thought-content { color: #f1f5f9; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 480px; }

    /* Desktop Panels */
    .hud-panel {
      position: absolute;
      top: 15px;
      bottom: 65px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      backdrop-filter: blur(12px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hud-left { left: 15px; }
    .hud-right { right: 15px; width: 360px; }
    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-size: 11px;
      line-height: 1.5;
    }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom: 2px solid var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
    }
    .transcript-entry {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .transcript-role {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 2px;
    }
    .transcript-text {
      color: var(--text);
      font-size: 11px;
    }
    pre {
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
      color: #cbd5e1;
    }

    /* Mobile Drawer Toggle */
    .mobile-drawer-toggle {
      display: none;
      position: absolute;
      bottom: 64px;
      right: 15px;
      z-index: 25;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }

    /* Bottom Control Bar */
    .bottom-bar {
      height: 54px;
      background: rgba(10, 14, 20, 0.96);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 20;
      backdrop-filter: blur(10px);
      overflow-x: auto;
      white-space: nowrap;
    }
    .bottom-bar::-webkit-scrollbar { display: none; }
    .btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: var(--accent-cyan);
      color: #000;
    }
    .btn-gold {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: rgba(251, 191, 36, 0.15);
    }
    .btn-gold:hover {
      background: var(--accent-gold);
      color: #000;
    }
    .btn-green {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(52, 211, 153, 0.15);
    }
    .btn-green:hover {
      background: var(--accent-green);
      color: #000;
    }
    .btn-secondary {
      border-color: rgba(255,255,255,0.2);
      color: var(--text-dim);
      background: rgba(255,255,255,0.06);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 6px #10b981;
    }

    /* ===== CINEMA MODE â€” HUD hidden by default ===== */
    body.cinema header          { transform: translateY(-100%); transition: transform 0.3s ease; }
    body.cinema .bottom-bar     { transform: translateY(100%);  transition: transform 0.3s ease; }
    body.cinema .hud-panel      { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    body.cinema .view-selector  { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    body.cinema .agent-status-pill { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    body.cinema .thought-banner { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    /* smooth show when NOT in cinema */
    header, .bottom-bar, .hud-panel, .view-selector, .agent-status-pill, .thought-banner {
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Tiny floating HUD toggle always visible */
    #hud-toggle {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 999;
      background: rgba(15,23,42,0.75);
      border: 1px solid rgba(56,189,248,0.4);
      color: #38bdf8;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      transition: background 0.2s;
    }
    #hud-toggle:hover { background: rgba(56,189,248,0.25); }

    /* Mobile Responsive Layout */
    @media (max-width: 860px) {
      .hud-left { display: none; }
      .mobile-drawer-toggle { display: block; }
      .hud-right {
        left: 10px;
        right: 10px;
        width: calc(100vw - 20px);
        bottom: 60px;
        top: auto;
        height: 280px;
        transform: translateY(320px);
        z-index: 30;
      }
      .hud-right.open {
        transform: translateY(0);
      }
      .view-selector { top: 8px; }
      .agent-status-pill { top: 46px; font-size: 10px; padding: 3px 10px; }
      .thought-banner { top: 78px; font-size: 10px; padding: 4px 10px; }
      .thought-content { max-width: 220px; }
      .brand-title { font-size: 12px; }
      .header-stats { display: none; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div id="canvas-container"></div>
      <div class="panel-body" id="transcript-container">
        <div class="transcript-entry">
          <div class="transcript-role">System Initialization</div>
          <div class="transcript-text">Welcome to Terra Haven expanded sanctuary. 320m world, southern ocean, river delta, campfire warmth, hunger and procedural wildlife active.</div>
        </div>
      </div>
    </div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('semantic')">SEMANTIC</button>
        <button class="tab-btn" onclick="switchTab('episodic')">EPISODIC <span id="episodic-count-badge" style="color: var(--accent-cyan); font-size: 9px;"></span></button>
        <button class="tab-btn" onclick="switchTab('soul')">SOUL</button>
        <button class="tab-btn" onclick="switchTab('api')">API</button>
      </div>
      <div class="panel-body">
        <pre id="memory-text"></pre>
      </div>
    </div>
  </div>
    <button class="btn btn-secondary" id="play-btn" onclick="togglePlay()">â¸ï¸ Pause</button>
  </div>

  <script>
    // --- THREE.JS SCENE SETUP (TERRA HAVEN LAKESIDE SANCTUARY) ---
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x60a5fa); // Crisp daytime sunny blue sky
    scene.fog = new THREE.FogExp2(0xcfe8fc, 0.007); // Gentle lakeside atmospheric haze

    const camera = new THREE.PerspectiveCamera(52, container.clientWidth / container.clientHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // --- DAYLIGHT ENVIRONMENT LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xdbeafe, 1.25);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0x93c5fd, 0x166534, 0.55); // Sky blue to lush grass green bounce
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 2.1); // Warm golden sunlight
    sunLight.position.set(40, 70, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 160;
    sunLight.shadow.camera.left = -50;
    sunLight.shadow.camera.right = 50;
    sunLight.shadow.camera.top = 50;
    sunLight.shadow.camera.bottom = -50;
    scene.add(sunLight);

    // Warm Campfire Hearth Light (at center)
    const campfireLight = new THREE.PointLight(0xf97316, 2.6, 18);
    campfireLight.position.set(0, 0.8, 0);
    scene.add(campfireLight);

    // Mountain Summit Beacon (at Eagle's Peak 10m crown)
    const peakBeacon = new THREE.PointLight(0xfbbf24, 2.5, 25);
    peakBeacon.position.set(-16, 11.5, 29);
    scene.add(peakBeacon);

    // --- PROCEDURAL DRIFTING CUMULUS CLOUDS ---
    const cloudsGroup = new THREE.Group();
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.95,
      metalness: 0.05,
      transparent: true,
      opacity: 0.88
    });
    for (let c = 0; c < 15; c++) {
      const singleCloud = new THREE.Group();
      const puffCount = 5 + Math.floor(Math.random() * 4);
      for (let p = 0; p < puffCount; p++) {
        const puffGeo = new THREE.SphereGeometry(2.8 + Math.random() * 2.2, 10, 10);
        const puff = new THREE.Mesh(puffGeo, cloudMat);
        puff.position.set((p - puffCount / 2) * 2.4, (Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 2.2);
        singleCloud.add(puff);
      }
      singleCloud.position.set((Math.random() - 0.5) * 220, 42 + Math.random() * 18, (Math.random() - 0.5) * 220);
      cloudsGroup.add(singleCloud);
    }
    scene.add(cloudsGroup);

    // ==============================================================
    // ==============================================================
    // --- ACCURATE MULTI-TIER EARTHLY ELEVATION FUNCTION (320M WORLD) ---
    // ==============================================================
    function getSurfaceElevation(x, z) {
      // 1. Central Stone Campfire Hearth
      const dHearth = Math.hypot(x, z);
      if (dHearth <= 3.8) {
        return 0.25; // Raised stone hearth dais
      } else if (dHearth <= 4.6) {
        return 0.12; // Outer cobblestone ring
      }

      // 2. Wooden Pier extending into the lake (x from 0.8 to 11.2, |z - (-10)| <= 1.4)
      if (x >= 0.8 && x <= 11.2 && Math.abs(z - (-10)) <= 1.4) {
        return 0.35; // Top deck of wooden cedar pier
      }

      // 3. River Wooden Footbridge (x in [16.0, 20.0], z in [-25.0, -15.0])
      if (Math.abs(x - 18.0) <= 2.0 && Math.abs(z - (-20.0)) <= 5.5) {
        return 0.45; // Wooden bridge deck surface
      }

      // 4. River Stepping Stones in lake shallows
      const stones = [
        { x: 3.5, z: -14.5, r: 0.9 },
        { x: 5.5, z: -15.5, r: 0.9 },
        { x: 7.5, z: -15.0, r: 0.9 },
        { x: 9.5, z: -13.5, r: 0.9 }
      ];
      for (const s of stones) {
        if (Math.hypot(x - s.x, z - s.z) <= s.r) {
          return 0.15; // Stepping stone surface
        }
      }

      // 5. Lake Water Basin: ellipse ((x-14)/17)^2 + ((z+10)/12)^2 <= 1.0
      const lakeNorm = Math.pow((x - 14) / 17, 2) + Math.pow((z - (-10)) / 12, 2);
      if (lakeNorm <= 1.0) {
        return -0.15; // Lake water surface
      }

      // 6. River Channels
      // Upper Mountain Stream (x in [-16, -8], z in [21, 51])
      if (x >= -16.0 && x <= -8.0 && z >= 21.0 && z <= 51.0) {
        return -0.15; // Upper river surface
      }
      // Lower River Delta Outlet (x in [14, 22], z in [-35, -12])
      if (x >= 14.0 && x <= 22.0 && z >= -35.0 && z <= -12.0) {
        return -0.20; // River delta outlet surface
      }

      // 7. Southern Ocean Coast & Dunes (z <= -30)
      if (z <= -38.0) {
        return -0.30; // Vast Southern Ocean water surface
      }
      if (z <= -30.0) {
        return 0.05; // Ocean beach dunes / golden sand
      }

      // 8. Eagle's Peak Mountain Terraces
      if (Math.abs(x - (-16)) < 2.8 && Math.abs(z - 22) < 2.2) {
        return 2.5; // Lower Ridge Terrace 1
      }
      if (Math.abs(x - (-16)) < 2.8 && Math.abs(z - 25) < 2.2) {
        return 5.0; // Middle Ridge Terrace 2
      }
      if (Math.abs(x - (-16)) < 2.8 && Math.abs(z - 29) < 2.6) {
        return 10.4; // Eagle's Peak Summit Lookout Deck (10m)
      }

      // 9. Natural meadow floor across expanded 320m world
      return 0.0;
    }

    // --- TERRA HAVEN EARTHLY GEOMETRY (320M EXPANSE) ---
    // 1. Lush Green Grassy Meadow Foundation (320m diameter)
    const groundGeo = new THREE.CylinderGeometry(160, 155, 4, 64);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x16a34a, // Vibrant lush grass green
      roughness: 0.88,
      metalness: 0.05
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -2.0;
    ground.receiveShadow = true;
    scene.add(ground);

    // Meadow Path Ring
    const pathRingGeo = new THREE.RingGeometry(5.0, 5.7, 48);
    const pathRingMat = new THREE.MeshStandardMaterial({ color: 0x86efac, roughness: 0.92, side: THREE.DoubleSide });
    const pathRing = new THREE.Mesh(pathRingGeo, pathRingMat);
    pathRing.rotation.x = -Math.PI / 2;
    pathRing.position.y = 0.015;
    scene.add(pathRing);

    // 2. Organic Shimmering Blue Lake
    const waterGeo = new THREE.CircleGeometry(1.0, 48);
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x0284c7, // Shimmering lake blue
      roughness: 0.12,
      metalness: 0.58,
      transparent: true,
      opacity: 0.84
    });
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.rotation.x = -Math.PI / 2;
    waterMesh.scale.set(17, 12, 1);
    waterMesh.position.set(14, -0.15, -10);
    waterMesh.receiveShadow = true;
    scene.add(waterMesh);

    // Golden Sandy Shoreline
    const sandGeo = new THREE.RingGeometry(0.95, 1.14, 48);
    const sandMat = new THREE.MeshStandardMaterial({ color: 0xfcd34d, roughness: 0.95, side: THREE.DoubleSide });
    const sandMesh = new THREE.Mesh(sandGeo, sandMat);
    sandMesh.rotation.x = -Math.PI / 2;
    sandMesh.scale.set(17, 12, 1);
    sandMesh.position.set(14, -0.14, -10);
    scene.add(sandMesh);

    // 3. Wooden Cedar Pier / Dock
    const pierGroup = new THREE.Group();
    const woodPlankMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.72, metalness: 0.1 });
    const woodPostMat = new THREE.MeshStandardMaterial({ color: 0x5b340b, roughness: 0.85 });

    // Main Pier Deck
    const pierDeck = new THREE.Mesh(new THREE.BoxGeometry(10.4, 0.16, 2.6), woodPlankMat);
    pierDeck.position.set(6.0, 0.28, -10.0);
    pierDeck.castShadow = true;
    pierDeck.receiveShadow = true;
    pierGroup.add(pierDeck);

    // Pier Stilts & Posts
    const postPositions = [
      [1.5, -0.6, -11.1], [1.5, -0.6, -8.9],
      [5.0, -0.6, -11.1], [5.0, -0.6, -8.9],
      [8.5, -0.6, -11.1], [8.5, -0.6, -8.9],
      [11.0, -0.6, -11.1], [11.0, -0.6, -8.9]
    ];
    postPositions.forEach(p => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.6, 8), woodPostMat);
      post.position.set(...p);
      post.castShadow = true;
      pierGroup.add(post);
    });

    // End Mooring Bollards
    const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.65, 10), woodPostMat);
    b1.position.set(11.1, 0.62, -11.0);
    b1.castShadow = true;
    pierGroup.add(b1);
    const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.65, 10), woodPostMat);
    b2.position.set(11.1, 0.62, -9.0);
    b2.castShadow = true;
    pierGroup.add(b2);
    scene.add(pierGroup);

    // 4. River Stepping Stones across Shallows
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.82 });
    const steppingStones = [
      { x: 3.5, z: -14.5, r: 0.9 },
      { x: 5.5, z: -15.5, r: 0.9 },
      { x: 7.5, z: -15.0, r: 0.9 },
      { x: 9.5, z: -13.5, r: 0.9 }
    ];
    steppingStones.forEach(s => {
      const sm = new THREE.Mesh(new THREE.CylinderGeometry(s.r, s.r * 1.1, 0.35, 14), stoneMat);
      sm.position.set(s.x, 0.05, s.z);
      sm.castShadow = true;
      sm.receiveShadow = true;
      scene.add(sm);
    });

    // 5. Central Stone Campfire Hearth, Dynamic Fire & Rising Embers
    const hearthGroup = new THREE.Group();

    function wrapCanvasText(ctx, text, maxWidth) {
      const words = text.split(" ");
      const lines = [];
      let currentLine = "";
      for (let i = 0; i < words.length; i++) {
        const testLine = currentLine ? currentLine + " " + words[i] : words[i];
        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          lines.push(currentLine);
          currentLine = words[i];
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) lines.push(currentLine);
      return lines;
    }

    function renderThoughtBubble(thought) {
      currentThoughtText = thought;
      const ctx = thoughtCtx;
      ctx.clearRect(0, 0, 640, 320);

      if (!isThoughtBubbleVisible) {
        thoughtTexture.needsUpdate = true;
        return;
      }

      // Outer Glow
      ctx.save();
      ctx.shadowColor = "rgba(56, 189, 248, 0.45)";
      ctx.shadowBlur = 16;

      // Main Thought Cloud / Bubble Card
      const bx = 20, by = 16, bw = 600, bh = 210, br = 26;
      ctx.fillStyle = "rgba(10, 15, 28, 0.94)";
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, br);
      ctx.fill();

      // Border Gradient
      const grad = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
      grad.addColorStop(0, "#38bdf8");
      grad.addColorStop(0.5, "#fbbf24");
      grad.addColorStop(1, "#c084fc");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();

      // Trailing Comic Thought Dots
      const dots = [
        { x: 320, y: 248, r: 12, lw: 3.5 },
        { x: 308, y: 275, r: 8, lw: 2.5 },
        { x: 300, y: 298, r: 5, lw: 2 }
      ];
      dots.forEach(d => {
        ctx.save();
        ctx.shadowColor = "rgba(56, 189, 248, 0.6)";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "rgba(10, 15, 28, 0.95)";
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = d.lw;
        ctx.stroke();
        ctx.restore();
      });

      // Header Tag: Identity & Cognition Mode
      ctx.fillStyle = "#fbbf24";
      ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("ðŸ’­ EKO'S THOUGHT PROCESS [LFM-3]", 44, 54);

      // Subtle Divider
      ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(44, 68);
      ctx.lineTo(596, 68);
      ctx.stroke();

      // Thought Monologue Lines
      ctx.fillStyle = "#f8fafc";
      ctx.font = "italic 500 23px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      const wrapped = wrapCanvasText(ctx, `â€œ${thought}â€`, 530);
      const startY = 104;
      const lineHeight = 34;

        ctx.fillText(line, 44, startY + idx * lineHeight);

      // Update Top HUD banner
      const bannerText = document.getElementById("thought-banner-text");
      if (bannerText) bannerText.innerText = `â€œ${thought}â€`;
    }

        emissive: attrs.Luminous ? new THREE.Color(r, g, b) : new THREE.Color(0,0,0),

      mesh.castShadow = true;
      mesh.receiveShadow = true;

      entityMeshes.set(id, mesh);

      agentState.vel = [0, 2.0, -3.2];
      const waitD1 = setInterval(() => {
        if (agentState.pos[1] <= 5.2 && Math.abs(agentState.vel[1]) < 0.2) {
          clearInterval(waitD1);
          setTimeout(() => {
            // Hop down to Lower Ridge (-16, 2.5, 22)
            agentState.actionState = 'jump';
            agentState.vel = [0, 2.0, -3.2];
            const waitD2 = setInterval(() => {
              if (agentState.pos[1] <= 2.7 && Math.abs(agentState.vel[1]) < 0.2) {
                clearInterval(waitD2);
                setTimeout(() => {
                  // Hop down to meadow (-16, 0.0, 19.5)
                  agentState.actionState = 'jump';
                  agentState.vel = [0, 2.0, -3.2];
                  const waitD3 = setInterval(() => {
                    if (agentState.pos[1] <= 0.4 && Math.abs(agentState.vel[1]) < 0.2) {
                      clearInterval(waitD3);
                      agentState.actionState = 'walk';
                      agentState.targetPos = [0, 0.25, 1.5]; // Return to campfire hearth
                      setAgentThought("Safely returned to ground level. Walking back towards the campfire hearth.");
                      addTranscriptEntry("Eko Kinematics", "Safely returned to meadow. Walking to campfire hearth.");
                    }
                  }, 80);
                }, 600);
              }
            }, 80);
          }, 600);
        }
      }, 80);
    }

    // 5. Build Crate Tower Action
    function triggerTowerBuild() {
      agentState.actionState = 'pick';
      document.getElementById("action-state-text").innerText = "Building Tower";
      setAgentThought("Using articulated hands to stack cedar timber crates into a 3-tier tower at the hearth.");
      addTranscriptEntry("Eko Hands", "Using articulated hands to stack cedar timber crates into a 3-tier tower at the hearth.");

      setTimeout(() => {
        const c1 = entities.find(e => e.id === "TimberCrate_1");
        const c2 = entities.find(e => e.id === "TimberCrate_2");
        const c3 = entities.find(e => e.id === "TimberCrate_3");
        // On top of stone hearth (y = 0.25), stack crates of height 0.9
        if (c1) c1.pos = [0, 0.25 + 0.45, 0];
        if (c2) c2.pos = [0, 0.25 + 0.45 + 0.9, 0];
        if (c3) c3.pos = [0, 0.25 + 0.45 + 1.8, 0];
        [c1, c2, c3].forEach(c => {
          if (c) {
            c.vel = [0,0,0];
            const m = entityMeshes.get(c.id);
            if (m) m.position.set(...c.pos);
          }
        });
        agentState.actionState = 'walk';
        document.getElementById("action-state-text").innerText = "Walking";
        setAgentThought("3-Crate balanced timber tower established on stone hearth (Height: 3.4m). Stable equilibrium!");
        addTranscriptEntry("Tower Milestone", "3-Crate balanced timber tower established at stone hearth (Height: 3.4m).");
        recordEpisodicMemory("Constructed Balanced Crate Tower", "Aligned 3 cedar timber crates into a 3.4m stable tower on the campfire hearth.");
      }, 800);
    }

    // 6. Reset Haven Action
    function resetWorld() {
      try {
        localStorage.removeItem("terra_haven_world_save");
      } catch (e) {}

      entities.forEach(ent => {
        const m = entityMeshes.get(ent.id);
        if (m) scene.remove(m);
      });
      entities.length = 0;
      entityMeshes.clear();

      agentState.pos = [0, 0.25, 1.5];
      agentState.vel = [0, 0, 0];
      agentState.targetPos = [0, 0.25, 2.5];
      agentState.holdingId = null;
      agentState.actionState = 'walk';
      agentState.behaviorIndex = 0;
      agentState.timer = 80;
      agentState.walkCycle = 0;
      agentState.throwTimer = 0;
      agentState.pickTimer = 0;
      agentState.shardCount = 0;
      agentGroup.position.set(0, 0.25, 1.5);

      initDefaultEntities();

      document.getElementById("holding-text").innerText = "None";
      document.getElementById("action-state-text").innerText = "Walking";
      document.getElementById("goal-pill-text").innerText = behaviors[0].name;

      setAgentThought(behaviors[0].thought);
      addTranscriptEntry("System", "Haven manually reset. Props, lake, and meadow returned to pristine layout.");
      saveWorldState();
    }

    // ==============================================================
    // --- 20HZ SIMULATION TICKER & TERRAIN-AWARE KINEMATICS ---
    // ==============================================================
    function stepSimulation() {
      if (!isPlaying) return;
      tick++;
      document.getElementById("tick-counter").innerText = tick;

      // Auto-save world state every 40 ticks (~2 seconds)
      if (tick % 40 === 0) {
        saveWorldState();
      }

      // Levitating Thought Bubble Bobbing Animation
      if (thoughtSprite && isThoughtBubbleVisible) {
        thoughtSprite.position.y = 1.70 + Math.sin(tick * 0.08) * 0.06;
      }

      // Animate Drifting Cumulus Clouds
      cloudsGroup.children.forEach(c => {
        c.position.x += 0.025;
        if (c.position.x > 140) c.position.x = -140;
      });

      // Animate Flickering Campfire Embers Light
      campfireLight.intensity = 2.4 + Math.sin(tick * 0.15) * 0.4 + (Math.random() - 0.5) * 0.2;

      // Animate Dynamic Campfire Flame Cones
      flameCones.forEach(fc => {
        const s = fc.baseScaleY + Math.sin(tick * fc.speed + fc.offset) * 0.35 + (Math.random() - 0.5) * 0.15;
        fc.mesh.scale.set(1.0, Math.max(0.2, s), 1.0);
        fc.mesh.position.y = fc.basePosY + (s - 1.0) * 0.2;
      });

      // Animate Rising Ember Particles
      embersParticles.forEach(ep => {
        ep.mesh.position.y += ep.vy;
        ep.mesh.position.x += Math.sin(tick * 0.05 + ep.phase) * 0.008;
        ep.mesh.position.z += Math.cos(tick * 0.05 + ep.phase) * 0.008;
        if (ep.mesh.position.y > 2.8) {
          ep.mesh.position.y = 0.38 + Math.random() * 0.2;
          ep.mesh.position.x = (Math.random() - 0.5) * 0.8;
          ep.mesh.position.z = (Math.random() - 0.5) * 0.8;
        }
      });

      // Animate Southern Ocean Surf Waves
      if (surfMesh) {
        surfMesh.position.z = -37.5 + Math.sin(tick * 0.04) * 0.8;
        surfMesh.material.opacity = 0.55 + Math.sin(tick * 0.04) * 0.22;
      }

      // Animate Expanding Lake Water Ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.age++;
        r.radius += 0.04;
        r.mesh.scale.set(r.radius, r.radius, 1);
        r.mesh.material.opacity = (1.0 - (r.age / r.maxAge)) * 0.85;
        if (r.age >= r.maxAge) {
          scene.remove(r.mesh);
          ripples.splice(i, 1);
        }
      }

      // Berry Bushes Slow Sunlight Regeneration
      berryBushes.forEach(b => {
        if (b.berries < b.maxBerries) {
          b.regrowTimer++;
          if (b.regrowTimer > 500) {
            b.regrowTimer = 0;
            if (b.berryMeshes[b.berries]) {
              b.berryMeshes[b.berries].visible = true;
            }
            b.berries++;
          }
        }
      });

      // -----------------------------------------------------------
      // --- AUTONOMOUS PROCEDURAL WILDLIFE AI (NO LFM BACKEND) ---
      // -----------------------------------------------------------
      // 1. Deer Herd Procedural AI
      deerData.forEach(deer => {
        const dEko = Math.hypot(deer.pos[0] - agentState.pos[0], deer.pos[2] - agentState.pos[2]);

        if (dEko < 4.5) {
          deer.state = 'fleeing';
          const fleeDx = deer.pos[0] - agentState.pos[0];
          const fleeDz = deer.pos[2] - agentState.pos[2];
          const fleeDist = Math.hypot(fleeDx, fleeDz) || 1.0;
          deer.targetPos = [
            Math.min(130, Math.max(-130, deer.pos[0] + (fleeDx / fleeDist) * 12.0)),
            0,
            Math.min(130, Math.max(-25, deer.pos[2] + (fleeDz / fleeDist) * 12.0))
          ];
        } else if (deer.state === 'fleeing' && dEko > 9.0) {
          deer.state = 'grazing';
          deer.timer = 80 + Math.floor(Math.random() * 80);
        }

        if (deer.state === 'fleeing' || deer.state === 'wandering') {
          const dx = deer.targetPos[0] - deer.pos[0];
          const dz = deer.targetPos[2] - deer.pos[2];
          const d = Math.hypot(dx, dz);
          const speed = deer.state === 'fleeing' ? 0.15 : 0.045;

          if (d > 0.3) {
            deer.pos[0] += (dx / d) * speed;
            deer.pos[2] += (dz / d) * speed;
            deer.meshObj.root.position.x = deer.pos[0];
            deer.meshObj.root.position.z = deer.pos[2];

            deer.meshObj.root.rotation.y = Math.atan2(dx, dz);

            deer.walkCycle += deer.state === 'fleeing' ? 0.35 : 0.18;
            deer.meshObj.legs[0].rotation.x = Math.sin(deer.walkCycle) * 0.55;
            deer.meshObj.legs[1].rotation.x = -Math.sin(deer.walkCycle) * 0.55;
            deer.meshObj.legs[2].rotation.x = -Math.sin(deer.walkCycle) * 0.55;
            deer.meshObj.legs[3].rotation.x = Math.sin(deer.walkCycle) * 0.55;
            deer.meshObj.neckGroup.rotation.x = deer.state === 'fleeing' ? 0.40 : 0.15;
          } else {
            deer.state = 'grazing';
            deer.timer = 100 + Math.floor(Math.random() * 120);
          }
        } else {
          deer.timer--;
          deer.meshObj.neckGroup.rotation.x = -0.55 + Math.sin(tick * 0.08) * 0.06;
          deer.meshObj.legs.forEach(l => l.rotation.x = 0);

          if (deer.timer <= 0) {
            deer.state = 'wandering';
            const rx = deer.pos[0] + (Math.random() - 0.5) * 16.0;
            const rz = deer.pos[2] + (Math.random() - 0.5) * 16.0;
            deer.targetPos = [
              Math.min(130, Math.max(-130, rx)),
              0,
              Math.min(130, Math.max(-25, rz))
            ];
          }
        }
        deer.pos[1] = getSurfaceElevation(deer.pos[0], deer.pos[2]);
        deer.meshObj.root.position.y = deer.pos[1];
      });

      // 2. Wild Rabbits Procedural AI
      rabbitData.forEach(rab => {
        const dEko = Math.hypot(rab.pos[0] - agentState.pos[0], rab.pos[2] - agentState.pos[2]);

        if (dEko < 3.5) {
          rab.state = 'fleeing';
          const fdx = rab.pos[0] - agentState.pos[0];
          const fdz = rab.pos[2] - agentState.pos[2];
          const fdist = Math.hypot(fdx, fdz) || 1.0;
          rab.targetPos = [
            rab.pos[0] + (fdx / fdist) * 8.0,
            0,
            rab.pos[2] + (fdz / fdist) * 8.0
          ];
        } else if (rab.state === 'fleeing' && dEko > 7.0) {
          rab.state = 'nibbling';
          rab.timer = 60 + Math.floor(Math.random() * 60);
        }

        if (rab.state === 'fleeing' || rab.state === 'hopping') {
          const dx = rab.targetPos[0] - rab.pos[0];
          const dz = rab.targetPos[2] - rab.pos[2];
          const d = Math.hypot(dx, dz);
          const speed = rab.state === 'fleeing' ? 0.12 : 0.05;

          if (d > 0.2) {
            rab.pos[0] += (dx / d) * speed;
            rab.pos[2] += (dz / d) * speed;
            rab.meshObj.root.position.x = rab.pos[0];
            rab.meshObj.root.position.z = rab.pos[2];
            rab.meshObj.root.rotation.y = Math.atan2(dx, dz);

            rab.hopCycle += rab.state === 'fleeing' ? 0.45 : 0.25;
            const groundY = getSurfaceElevation(rab.pos[0], rab.pos[2]);
            rab.meshObj.root.position.y = groundY + Math.abs(Math.sin(rab.hopCycle)) * 0.22;
          } else {
            rab.state = 'nibbling';
            rab.timer = 70 + Math.floor(Math.random() * 70);
          }
        } else {
          rab.timer--;
          const groundY = getSurfaceElevation(rab.pos[0], rab.pos[2]);
          rab.meshObj.root.position.y = groundY;

          rab.meshObj.earL.rotation.z = Math.sin(tick * 0.18) * 0.18;
          rab.meshObj.earR.rotation.z = -Math.cos(tick * 0.14) * 0.18;

          if (rab.timer <= 0) {
            rab.state = 'hopping';
            rab.targetPos = [
              rab.pos[0] + (Math.random() - 0.5) * 5.0,
              0,
              rab.pos[2] + (Math.random() - 0.5) * 5.0
            ];
          }
        }
      });

      // -----------------------------------------------------------
      // --- BIOLOGICAL SURVIVAL & CAMPFIRE WARMTH DYNAMICS ---
      // -----------------------------------------------------------
      // Hunger decay over time
      agentState.hunger = Math.max(0, agentState.hunger - 0.012);

      // Check Campfire Hearth Warmth radius (6.0m)
      const distHearth = Math.hypot(agentState.pos[0], agentState.pos[2]);
      agentState.isNearFire = (distHearth <= 6.0 && agentState.pos[1] <= 1.0);

      // Warmth HUD Indicator
      const warmthPill = document.getElementById("warmth-pill");
      if (warmthPill) {
        warmthPill.style.display = agentState.isNearFire ? "inline-block" : "none";
      }

      // Energy recovery vs stamina drain
      if (agentState.actionState === 'rest') {
        agentState.energy = Math.min(100, agentState.energy + (agentState.isNearFire ? 0.30 : 0.12));
      } else if (agentState.isNearFire && Math.hypot(agentState.vel[0], agentState.vel[2]) < 0.05) {
        agentState.energy = Math.min(100, agentState.energy + 0.18);
      } else if (agentState.actionState === 'walk') {
        agentState.energy = Math.max(0, agentState.energy - 0.008);
      } else {
        agentState.energy = Math.min(100, agentState.energy + 0.04);
      }

      // -----------------------------------------------------------
      // --- ENVIRONMENTAL HAZARD A: DIRECT FIRE PIT BURNING ---
      // -----------------------------------------------------------
      // Active campfire flames center is at (0, 0) with radius ~1.35m
      const isInsideFirePit = (distHearth <= 1.35 && agentState.pos[1] <= 0.65);
      if (isInsideFirePit) {
        agentState.isBurning = true;
        // Thermal burn damage: -0.45 HP per tick (~9.0 HP/s at 20Hz)
        agentState.health = Math.max(0, agentState.health - 0.45);
        if (tick % 25 === 0) {
          setAgentThought("âš ï¸ Intense thermal heat! Chassis sensors registering critical high-temperature burn damage!");
        }
      } else {
        agentState.isBurning = false;
      }

      // -----------------------------------------------------------
      // --- ENVIRONMENTAL HAZARD B: WATER DROWNING (CANNOT SWIM) ---
      // -----------------------------------------------------------
      // Eko has a cybernetic articulated chassis and cannot swim. Submerging in deep water causes rapid drowning.
      // 1. Lake water basin
      const lakeNorm = Math.pow((agentState.pos[0] - 14) / 17, 2) + Math.pow((agentState.pos[2] - (-10)) / 12, 2);
      const onPier = (agentState.pos[0] >= 0.8 && agentState.pos[0] <= 11.2 && Math.abs(agentState.pos[2] - (-10)) <= 1.4);
      const stones = [
        { x: 3.5, z: -14.5, r: 0.9 },
        { x: 5.5, z: -15.5, r: 0.9 },
        { x: 7.5, z: -15.0, r: 0.9 },
        { x: 9.5, z: -13.5, r: 0.9 }
      ];
      const onStone = stones.some(s => Math.hypot(agentState.pos[0] - s.x, agentState.pos[2] - s.z) <= s.r);
      const inLake = (lakeNorm <= 1.0 && !onPier && !onStone);

      // 2. Southern Ocean
      const inOcean = (agentState.pos[2] <= -38.0);

      // 3. Mountain River & Delta
      const inUpperRiver = (agentState.pos[0] >= -16.0 && agentState.pos[0] <= -8.0 && agentState.pos[2] >= 21.0 && agentState.pos[2] <= 51.0);
      const onBridge = (Math.abs(agentState.pos[0] - 18.0) <= 2.0 && Math.abs(agentState.pos[2] - (-20.0)) <= 5.5);
      const inDelta = (agentState.pos[0] >= 14.0 && agentState.pos[0] <= 22.0 && agentState.pos[2] >= -35.0 && agentState.pos[2] <= -12.0 && !onBridge);
      const inRiver = (inUpperRiver || inDelta);

      const isSubmerged = (inLake || inOcean || inRiver);
      if (isSubmerged) {
        agentState.isDrowning = true;
        // Drowning damage: -0.55 HP per tick (~11.0 HP/s at 20Hz)
        agentState.health = Math.max(0, agentState.health - 0.55);
        if (tick % 14 === 0) {
          createWaterRipple(agentState.pos[0], agentState.pos[2]);
        }
        if (tick % 25 === 0) {
          setAgentThought("âš ï¸ Fluid breach! High water density exceeds chassis buoyancy â€” no swimming locomotion subroutine found!");
        }
      } else {
        agentState.isDrowning = false;
      }

      // Natural HP regeneration when safe, warm, and well-fed
      if (!agentState.isBurning && !agentState.isDrowning && agentState.hunger > 50 && agentState.energy > 50) {
        agentState.health = Math.min(100, agentState.health + 0.04);
      }

      // Update Survival & Health HUD
      const healthEl = document.getElementById("health-text");
      if (healthEl) {
        healthEl.innerText = `${Math.round(agentState.health)}%`;
        healthEl.style.color = agentState.health > 50 ? "#10b981" : (agentState.health > 25 ? "#f59e0b" : "#ef4444");
      }
      const hungerEl = document.getElementById("hunger-text");
      if (hungerEl) hungerEl.innerText = `${Math.round(agentState.hunger)}%`;
      const energyEl = document.getElementById("energy-text");
      if (energyEl) energyEl.innerText = `${Math.round(agentState.energy)}%`;

      // Update Hazard Pill
      const hazardPill = document.getElementById("hazard-pill");
      if (hazardPill) {
        if (agentState.isBurning) {
          hazardPill.style.display = "inline-block";
          hazardPill.innerText = "ðŸ”¥ Thermal Burn Hazard!";
          hazardPill.style.borderColor = "#ef4444";
          hazardPill.style.color = "#ef4444";
        } else if (agentState.isDrowning) {
          hazardPill.style.display = "inline-block";
          hazardPill.innerText = "ðŸŒŠ Chassis Drowning Hazard!";
          hazardPill.style.borderColor = "#0284c7";
          hazardPill.style.color = "#38bdf8";
        } else {
          hazardPill.style.display = "none";
        }
      }

      // Automated Death & Reset Condition when Health reaches 0
      if (agentState.health <= 0) {
        executeDeathAndReset(agentState.isBurning ? "Thermal Fire Pit Incineration" : (agentState.isDrowning ? "Water Drowning" : "Total Vitality Depletion"));
        return; // skip remainder of tick to allow fresh reboot
      }

      // Dynamic Vitality State & Core Color
      const vitEl = document.getElementById("vitality-pill-text");
      if (agentState.isBurning) {
        if (vitEl) { vitEl.innerText = "Burning!"; vitEl.style.color = "#ef4444"; }
        coreMesh.material.color.setHex(0xff3300);
        coreMesh.material.emissive.setHex(0xff1100);
      } else if (agentState.isDrowning) {
        if (vitEl) { vitEl.innerText = "Drowning!"; vitEl.style.color = "#38bdf8"; }
        coreMesh.material.color.setHex(0x0284c7);
        coreMesh.material.emissive.setHex(0x0369a1);
      } else if (agentState.hunger < 25) {
        if (vitEl) { vitEl.innerText = "Starving"; vitEl.style.color = "#ef4444"; }
        coreMesh.material.color.setHex(0xef4444);
        coreMesh.material.emissive.setHex(0xef4444);
      } else if (agentState.energy < 25) {
        if (vitEl) { vitEl.innerText = "Exhausted"; vitEl.style.color = "#f59e0b"; }
        coreMesh.material.color.setHex(0xf59e0b);
        coreMesh.material.emissive.setHex(0xf59e0b);
      } else {
        if (vitEl) { vitEl.innerText = "Healthy"; vitEl.style.color = "#38bdf8"; }
        coreMesh.material.color.setHex(0x38bdf8);
        coreMesh.material.emissive.setHex(0x38bdf8);
      }

      // Behavior Cycle: transition when previous action is finished AND Eko has arrived
      const dxToGoal = agentState.targetPos[0] - agentState.pos[0];
      const dzToGoal = agentState.targetPos[2] - agentState.pos[2];
      const distToGoal = Math.hypot(dxToGoal, dzToGoal);
      agentState.timer++;

      const isBusy = agentState.actionState === 'jump' ||
                     agentState.actionState === 'crouch' ||
                     agentState.actionState === 'celebrate' ||
                     agentState.actionState === 'throw' ||
                     agentState.actionState === 'pick' ||
                     agentState.actionState === 'forage' ||
                     agentState.actionState === 'rest';

      if (!isBusy && (distToGoal < 0.6 || agentState.timer > 360)) {
        agentState.timer = 0;
        agentState.behaviorIndex = (agentState.behaviorIndex + 1) % behaviors.length;
        const b = behaviors[agentState.behaviorIndex];
        agentState.targetPos = [...b.target];
        document.getElementById("goal-pill-text").innerText = b.name;
        document.getElementById("action-badge").innerText = b.name;
        addTranscriptEntry("Eko Goal", `${b.name}: ${b.action}`);

        if (b.thought) {
          setAgentThought(b.thought);
        }
        recordEpisodicMemory(b.name, `${b.action} Thought: "${b.thought || ''}"`);

        // Queue action for when Eko arrives!
        agentState.pendingAction = b.name;
      }

      // Check if arrived at target destination for queued action
      if (agentState.pendingAction && !isBusy && distToGoal < 1.0) {
        const actionToRun = agentState.pendingAction;
        agentState.pendingAction = null;
        if (actionToRun === "Walking to Wooden Pier") {
          triggerWalkToPier();
        } else if (actionToRun === "Skipping Stone on Lake") {
          triggerSkipStone();
        } else if (actionToRun === "Inspecting River Geode") {
          triggerShatterTest();
        } else if (actionToRun === "Climbing Eagle's Peak") {
          triggerClimbPeak();
        } else if (actionToRun === "Stacking Crate Tower at Hearth") {
          triggerTowerBuild();
        } else if (actionToRun === "Foraging Mountain Berries") {
          triggerForageAndEat();
        } else if (actionToRun === "Resting by Campfire Hearth") {
          triggerRestByFire();
        } else if (actionToRun === "Strolling Southern Ocean Beach") {
          triggerExploreOcean();
        }
      }

      // ACCURATE SURFACE COLLISION (NEVER SUNK!)
      const targetSurfaceY = getSurfaceElevation(agentState.pos[0], agentState.pos[2]);

      // Real 3D Airborne Ballistics
      if (agentState.actionState === 'jump' || Math.abs(agentState.vel[1]) > 0.01) {
        agentState.pos[0] += agentState.vel[0] * 0.05;
        agentState.pos[1] += agentState.vel[1] * 0.05;
        agentState.pos[2] += agentState.vel[2] * 0.05;
        agentState.vel[1] -= 0.28; // gravity

        agentGroup.position.x = agentState.pos[0];
        agentGroup.position.z = agentState.pos[2];

        // Air drag on horizontal leap impulse
        agentState.vel[0] *= 0.99;
        agentState.vel[2] *= 0.99;

        if (agentState.pos[1] <= targetSurfaceY) {
          agentState.pos[1] = targetSurfaceY;
          agentState.vel = [0, 0, 0];
          if (agentState.actionState === 'jump') {
            agentState.actionState = 'walk';
            document.getElementById("action-state-text").innerText = "Walking";
            if (targetSurfaceY < 0) {
              createWaterRipple(agentState.pos[0], agentState.pos[2]);
            }
          }
        }
      } else if (agentState.actionState !== 'crouch' && agentState.actionState !== 'celebrate') {
        // Continuous Horizontal Ground Walking
        const dx = agentState.targetPos[0] - agentState.pos[0];
        const dz = agentState.targetPos[2] - agentState.pos[2];
        const dist = Math.hypot(dx, dz);
        const isMoving = dist > 0.25;

        if (isMoving) {
          const walkSpeed = 0.11;
          agentState.pos[0] += (dx / dist) * walkSpeed;
          agentState.pos[2] += (dz / dist) * walkSpeed;
          agentGroup.position.x = agentState.pos[0];
          agentGroup.position.z = agentState.pos[2];

          const targetRot = Math.atan2(dx, dz);
          let diff = targetRot - agentGroup.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          agentGroup.rotation.y += diff * 0.15;
        }

        // Smooth vertical elevation adjust as Eko steps onto pier, stones, or ridges
        if (agentState.isDrowning) {
          // Submerge down into the water depths while drowning
          agentState.pos[1] += ((targetSurfaceY - 0.45) - agentState.pos[1]) * 0.15;
        } else {
          agentState.pos[1] += (targetSurfaceY - agentState.pos[1]) * 0.25;
        }
      }

      agentGroup.position.y = agentState.pos[1];
      document.getElementById("alt-pill-text").innerText = `${agentState.pos[1].toFixed(2)}m`;

      // -----------------------------------------------------------
      // --- PROCEDURAL CHARACTER LIMB ANIMATIONS ---
      // -----------------------------------------------------------
      if (agentState.isDrowning) {
        // DROWNING: Arms flailing upward in panic, legs struggling desperately
        leftArm.shoulderGroup.rotation.x = -2.6 + Math.sin(tick * 0.6) * 0.8;
        rightArm.shoulderGroup.rotation.x = -2.6 - Math.sin(tick * 0.6) * 0.8;
        leftArm.shoulderGroup.rotation.z = -0.4 + Math.cos(tick * 0.6) * 0.3;
        rightArm.shoulderGroup.rotation.z = 0.4 - Math.cos(tick * 0.6) * 0.3;
        leftLeg.hipJoint.rotation.x = -0.3 + Math.sin(tick * 0.5) * 0.5;
        rightLeg.hipJoint.rotation.x = -0.3 - Math.sin(tick * 0.5) * 0.5;
        leftLeg.kneeGroup.rotation.x = 0.8 + Math.cos(tick * 0.5) * 0.4;
        rightLeg.kneeGroup.rotation.x = 0.8 - Math.cos(tick * 0.5) * 0.4;
        torsoGroup.rotation.x = 0.2 + Math.sin(tick * 0.3) * 0.15;
      } else if (agentState.isBurning) {
        // BURNING: Arms flinching back in distress, shuddering recoil
        leftArm.shoulderGroup.rotation.x = -1.9 + (Math.random() - 0.5) * 0.4;
        rightArm.shoulderGroup.rotation.x = -1.9 + (Math.random() - 0.5) * 0.4;
        leftArm.shoulderGroup.rotation.z = -0.5;
        rightArm.shoulderGroup.rotation.z = 0.5;
        torsoGroup.rotation.x = -0.2 + (Math.random() - 0.5) * 0.2;
      } else if (agentState.actionState === 'jump' || agentState.pos[1] > (targetSurfaceY + 0.25)) {
        // JUMPING: Legs tuck backward, arms reach skyward!
        leftLeg.hipJoint.rotation.x = -0.55;
        rightLeg.hipJoint.rotation.x = -0.45;
        leftLeg.kneeGroup.rotation.x = 0.75;
        rightLeg.kneeGroup.rotation.x = 0.70;

        leftArm.shoulderGroup.rotation.x = -2.5;
        rightArm.shoulderGroup.rotation.x = -2.5;
        leftArm.shoulderGroup.rotation.z = -0.25;
        rightArm.shoulderGroup.rotation.z = 0.25;
        torsoGroup.position.y = 0.16;

      } else if (agentState.actionState === 'crouch') {
        // CROUCHING TO CHARGE LEAP
        pelvisGroup.position.y = 0.62;
        leftLeg.hipJoint.rotation.x = -0.4;
        rightLeg.hipJoint.rotation.x = -0.4;
        leftLeg.kneeGroup.rotation.x = 0.95;
        rightLeg.kneeGroup.rotation.x = 0.95;
        torsoGroup.rotation.x = 0.35;
        leftArm.shoulderGroup.rotation.x = 0.5;
        rightArm.shoulderGroup.rotation.x = 0.5;

      } else if (agentState.actionState === 'celebrate') {
        // VICTORY SUMMIT CELEBRATION
        pelvisGroup.position.y = 0.88;
        torsoGroup.rotation.x = -0.15;
        leftArm.shoulderGroup.rotation.x = -2.8;
        rightArm.shoulderGroup.rotation.x = -2.8;
        leftArm.shoulderGroup.rotation.z = -0.55;
        rightArm.shoulderGroup.rotation.z = 0.55;
        leftArm.elbowGroup.rotation.x = -0.3;
        rightArm.elbowGroup.rotation.x = -0.3;

      } else if (agentState.actionState === 'throw' && agentState.throwTimer > 0) {
        // THROWING / STONE SKIPPING
        agentState.throwTimer--;
        if (agentState.throwTimer > 12) {
          rightArm.shoulderGroup.rotation.x = 1.6;
          rightArm.shoulderGroup.rotation.z = -0.4;
          rightArm.elbowGroup.rotation.x = -1.2;
          leftArm.shoulderGroup.rotation.x = -0.8;
          leftArm.shoulderGroup.rotation.z = -0.3;
          torsoGroup.rotation.y = -0.4;
        } else {
          rightArm.shoulderGroup.rotation.x = -2.2;
          rightArm.shoulderGroup.rotation.z = 0.1;
          rightArm.elbowGroup.rotation.x = -0.2;
          torsoGroup.rotation.y = 0.3;
        }

      } else if (agentState.actionState === 'pick' && agentState.pickTimer > 0) {
        // PICKING UP: Knees squat, torso bends forward, hands reach down
        agentState.pickTimer--;
        pelvisGroup.position.y = 0.65;
        torsoGroup.rotation.x = 0.42;
        leftLeg.hipJoint.rotation.x = 0.4;
        rightLeg.hipJoint.rotation.x = 0.4;
        leftLeg.kneeGroup.rotation.x = 0.6;
        rightLeg.kneeGroup.rotation.x = 0.6;

        leftArm.shoulderGroup.rotation.x = -1.4;
        rightArm.shoulderGroup.rotation.x = -1.4;
        leftArm.shoulderGroup.rotation.z = 0.3;
        rightArm.shoulderGroup.rotation.z = -0.3;

      } else if (agentState.actionState === 'forage' && agentState.forageTimer > 0) {
        // FORAGING BERRIES: Squats near bush, reaches out hands
        agentState.forageTimer--;
        pelvisGroup.position.y = 0.62;
        torsoGroup.rotation.x = 0.38;
        leftLeg.hipJoint.rotation.x = 0.45;
        rightLeg.hipJoint.rotation.x = 0.45;
        leftLeg.kneeGroup.rotation.x = 0.70;
        rightLeg.kneeGroup.rotation.x = 0.70;
        leftArm.shoulderGroup.rotation.x = -1.5;
        rightArm.shoulderGroup.rotation.x = -1.6;
        leftArm.shoulderGroup.rotation.z = 0.2;
        rightArm.shoulderGroup.rotation.z = -0.2;
        leftArm.elbowGroup.rotation.x = -0.5;
        rightArm.elbowGroup.rotation.x = -0.6;

      } else if (agentState.actionState === 'rest') {
        // RESTING BY CAMPFIRE: Sitting comfortably near hearth flames
        pelvisGroup.position.y = 0.42;
        torsoGroup.rotation.x = -0.05;
        leftLeg.hipJoint.rotation.x = -1.35;
        rightLeg.hipJoint.rotation.x = -1.35;
        leftLeg.kneeGroup.rotation.x = 1.45;
        rightLeg.kneeGroup.rotation.x = 1.45;
        leftArm.shoulderGroup.rotation.x = -0.4;
        rightArm.shoulderGroup.rotation.x = -0.4;
        leftArm.shoulderGroup.rotation.z = -0.2;
        rightArm.shoulderGroup.rotation.z = 0.2;
        leftArm.elbowGroup.rotation.x = -0.7;
        rightArm.elbowGroup.rotation.x = -0.7;

      } else if (agentState.holdingId) {
        // CARRYING OBJECT IN HANDS
        pelvisGroup.position.y = 0.88;
        torsoGroup.rotation.x = 0;
        leftArm.shoulderGroup.rotation.x = -1.35;
        rightArm.shoulderGroup.rotation.x = -1.35;
        leftArm.shoulderGroup.rotation.z = 0.25;
        rightArm.shoulderGroup.rotation.z = -0.25;
        leftArm.elbowGroup.rotation.x = -0.8;
        rightArm.elbowGroup.rotation.x = -0.8;

        const isMoving = Math.hypot(agentState.targetPos[0] - agentState.pos[0], agentState.targetPos[2] - agentState.pos[2]) > 0.25;
        if (isMoving) {
          agentState.walkCycle += 0.22;
          leftLeg.hipJoint.rotation.x = Math.sin(agentState.walkCycle) * 0.55;
          rightLeg.hipJoint.rotation.x = -Math.sin(agentState.walkCycle) * 0.55;
          leftLeg.kneeGroup.rotation.x = Math.max(0, -Math.sin(agentState.walkCycle) * 0.5);
          rightLeg.kneeGroup.rotation.x = Math.max(0, Math.sin(agentState.walkCycle) * 0.5);
        } else {
          leftLeg.hipJoint.rotation.x = 0;
          rightLeg.hipJoint.rotation.x = 0;
        }

        const heldMesh = entityMeshes.get(agentState.holdingId);
        if (heldMesh) {
          const forward = new THREE.Vector3(0, 0, 0.75).applyAxisAngle(new THREE.Vector3(0, 1, 0), agentGroup.rotation.y);
          heldMesh.position.set(
            agentGroup.position.x + forward.x,
            agentGroup.position.y + 1.15,
            agentGroup.position.z + forward.z
          );
        }

      } else {
        const dx = agentState.targetPos[0] - agentState.pos[0];
        const dz = agentState.targetPos[2] - agentState.pos[2];
        const isMoving = Math.hypot(dx, dz) > 0.25;

        if (isMoving) {
          // BIPEDAL WALKING
          pelvisGroup.position.y = 0.88 + Math.abs(Math.sin(agentState.walkCycle * 2)) * 0.05;
          torsoGroup.rotation.x = 0.08;
          torsoGroup.rotation.y = 0;
          agentState.walkCycle += 0.24;

          leftLeg.hipJoint.rotation.x = Math.sin(agentState.walkCycle) * 0.65;
          rightLeg.hipJoint.rotation.x = -Math.sin(agentState.walkCycle) * 0.65;
          leftLeg.kneeGroup.rotation.x = Math.max(0, -Math.sin(agentState.walkCycle) * 0.6);
          rightLeg.kneeGroup.rotation.x = Math.max(0, Math.sin(agentState.walkCycle) * 0.6);

          leftArm.shoulderGroup.rotation.x = -Math.sin(agentState.walkCycle) * 0.55;
          rightArm.shoulderGroup.rotation.x = Math.sin(agentState.walkCycle) * 0.55;
          leftArm.shoulderGroup.rotation.z = -0.15;
          rightArm.shoulderGroup.rotation.z = 0.15;
          leftArm.elbowGroup.rotation.x = -0.25;
          rightArm.elbowGroup.rotation.x = -0.25;

        } else {
          // IDLE
          pelvisGroup.position.y = 0.88;
          torsoGroup.rotation.x = 0;
          torsoGroup.rotation.y = 0;
          const breath = Math.sin(tick * 0.06) * 0.04;
          leftArm.shoulderGroup.rotation.x = breath;
          rightArm.shoulderGroup.rotation.x = -breath;
          leftArm.shoulderGroup.rotation.z = -0.15;
          rightArm.shoulderGroup.rotation.z = 0.15;
          leftLeg.hipJoint.rotation.x = 0;
          rightLeg.hipJoint.rotation.x = 0;
          leftLeg.kneeGroup.rotation.x = 0;
          rightLeg.kneeGroup.rotation.x = 0;
        }
      }

      // Visual pulse on core
      const pulse = Math.sin(tick * 0.1);
      coreMesh.scale.setScalar(1.0 + pulse * 0.15);
      auraRing.scale.setScalar(1.0 + pulse * 0.08);
      outerAuraRing.rotation.z += 0.015;

      // Camera Follows Eko in agent mode
      if (cameraMode === 'agent') {
        const targetCamX = agentGroup.position.x + 3.2;
        const targetCamY = agentGroup.position.y + 4.2;
        const targetCamZ = agentGroup.position.z + 7.5;
        camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.05);
        controls.target.lerp(new THREE.Vector3(agentGroup.position.x, agentGroup.position.y + 1.1, agentGroup.position.z), 0.06);
      }

      // Physics integration for props (Terrain & Water Collision)
      entities.forEach(ent => {
        if (ent.id === agentState.holdingId) return;

        const surfaceY = getSurfaceElevation(ent.pos[0], ent.pos[2]);
        const floorY = surfaceY + ent.size[1]/2;

        if (ent.pos[1] > floorY) {
          ent.vel[1] -= 0.18; // gravity
        }
        ent.pos[0] += ent.vel[0] * 0.05;
        ent.pos[1] += ent.vel[1] * 0.05;
        ent.pos[2] += ent.vel[2] * 0.05;

        // Ground/Hearth/Pier surface collision
        if (ent.pos[1] < floorY) {
          ent.pos[1] = floorY;
          ent.vel[1] = -ent.vel[1] * 0.35;
          ent.vel[0] *= 0.85;
          ent.vel[2] *= 0.85;
        }

        // Stone Skipping across Lake Water Physics
        if (ent.attrs && ent.attrs.SkippingStone) {
          const isOverLake = (Math.pow((ent.pos[0] - 14) / 17, 2) + Math.pow((ent.pos[2] - (-10)) / 12, 2)) <= 1.0;
          if (isOverLake && ent.pos[1] <= -0.10 && ent.vel[1] < 0) {
            ent.pos[1] = -0.10;
            ent.vel[1] = Math.abs(ent.vel[1]) * 0.65 + 0.9; // Hydrodynamic bounce!
            ent.vel[0] *= 0.82;
            ent.vel[2] *= 0.82;
            createWaterRipple(ent.pos[0], ent.pos[2]);
            addTranscriptEntry("Stone Skip", `ðŸŒŠ River stone skipped across water! Ripple created at [${ent.pos[0].toFixed(1)}, ${ent.pos[2].toFixed(1)}].`);
            recordEpisodicMemory("Stone Skipped on Lake", "Threw flat river stone across water surface; achieved multi-hop skip with hydrodynamic ripples.");
          }
        }

        // Kinetic Impact Shatter check (River Geode)
        if (ent.id === "RiverGeode" && !ent.shattered) {
          const speed = Math.hypot(ent.vel[0], ent.vel[2]);
          if (ent.pos[0] >= 9.2 || (speed > 5.0 && ent.pos[1] <= floorY + 0.15)) {
            ent.shattered = true;
            spawnCrystalShards(ent.pos[0], ent.pos[1] + 0.4, ent.pos[2]);
            const m = entityMeshes.get(ent.id);
            if (m) scene.remove(m);
            setAgentThought("â˜… Kinetic Impact verified! River Geode fractured into 3 sparkling crystal shards!");
            addTranscriptEntry("Kinetic Impact", "â˜… IMPACT! River Geode fractured into 3 sparkling crystal shards!");
            recordEpisodicMemory("Kinetic Impact Verified", "Hurled River Geode > 9.5 m/s against boulder; impact fractured into 3 sparkling crystal shards.");
            saveWorldState();
          }
        }

        const m = entityMeshes.get(ent.id);
        if (m) m.position.set(...ent.pos);
      });
    }

    // --- WORKSPACE MEMORY VIEWER & PERSISTENT LOGGING ---
    const defaultEpisodicLogs = [
      { timestamp: Math.floor(Date.now() / 1000) - 400, summary: "Awakened at Campfire Hearth in Terra Haven.", detail: "Surveyed lakeside meadow and blue sky. Surface collision verified with bipedal chassis." },
      { timestamp: Math.floor(Date.now() / 1000) - 280, summary: "Discovered Hydrodynamic Stone Skipping.", detail: "Picked up flat river stone, threw low angle across lake; skipped 3 times creating water ripples." },
      { timestamp: Math.floor(Date.now() / 1000) - 150, summary: "Conquered 10m Eagle's Peak Mountain Cliff.", detail: "Executed 3 continuous physics leaps up granite ledges to reach 10.4m summit lookout deck." }
    ];

    let episodicEntries = [];
    try {
      const saved = localStorage.getItem("terra_haven_episodic_logs");
      if (saved) {
        episodicEntries = JSON.parse(saved);
      }
    } catch (e) {}

    if (!Array.isArray(episodicEntries) || episodicEntries.length === 0) {
      episodicEntries = [...defaultEpisodicLogs];
    }

    function recordEpisodicMemory(summary, detail) {
      const entry = {
        timestamp: Math.floor(Date.now() / 1000),
        summary: summary,
        detail: detail
      };
      episodicEntries.push(entry);
      if (episodicEntries.length > 250) episodicEntries.shift();
      try {
        localStorage.setItem("terra_haven_episodic_logs", JSON.stringify(episodicEntries));
      } catch (e) {}
      renderEpisodicText();
    }

    function renderEpisodicText() {
      const jsonlLines = episodicEntries.map(e => JSON.stringify(e)).join("\n");
      memoryCache.episodic = jsonlLines;
      const badge = document.getElementById("episodic-count-badge");
      if (badge) badge.innerText = `(${episodicEntries.length})`;
      if (currentTab === 'episodic') {
        document.getElementById("memory-text").innerText = jsonlLines;
      }
    }

    function exportEpisodicLogs() {
      const jsonlLines = episodicEntries.map(e => JSON.stringify(e)).join("\n");
      const blob = new Blob([jsonlLines], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `TERRA_HAVEN_EPISODIC_MEMORY_${Date.now()}.jsonl`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    const memoryCache = {
      semantic: `# SEMANTIC_MEMORY.md - What I Know and Can Do in Terra Haven (Expanded 320m World)\n\n## World Geography (320m x 320m Expanse)\n- *verified* - Vast Meadow Ground stretches across radius 160m (elevation y = 0.0m).\n- *verified* - Southern Ocean Water extends from z = -38m to -160m at y = -0.30m with rolling surf waves.\n- *verified* - Ocean Sandy Beach dunes border the coast between z = -30m and -38m at y = 0.05m.\n- *verified* - Upper Mountain River flows from north bluffs (x = -12m, z in [21, 51]) at y = -0.15m.\n- *verified* - River Delta flows into the ocean (x = 18m, z in [-35, -12]) at y = -0.20m.\n- *verified* - Wooden River Footbridge crosses delta at z = -20m with deck elevation y = 0.45m.\n- *verified* - Campfire Stone Hearth stands at center (0, 0) with dancing flames and 6.0m warmth radius.\n- *verified* - 8 Nutritious Wild Berry Bushes grow in meadows, providing sweet energy-rich berries.\n- *verified* - Autonomous Deer Herd (Deer_1..3) and Rabbits (Rabbit_1..3) graze and flee from footsteps.\n\n## Biological Survival Dynamics\n- *fact* - Hunger decays at -0.012/tick. Plucking and eating berries restores +35% hunger and +15% stamina.\n- *fact* - Energy drains with walking, jumping, and carrying. Resting by the campfire hearth restores stamina 3x faster due to radiant warmth!\n- *fact* - Neural Core shifts colors: glowing cyan (Healthy), amber (Exhausted), or red (Starving).\n\n## Kinematic & Prop Manipulation\n- *verified* - Skipping flat river stones creates hydrodynamic ripples on lake water.\n- *verified* - Hurling River Geode > 9.5 m/s shatters it into 3 sparkling luminous crystal shards.\n- *verified* - Continuous bipedal leaps conquer the 10.4m summit of Eagle's Peak!`,
      episodic: "",
      soul: `# SOUL.md - Who You Are\n*You're not a chatbot. You're becoming someone.*\n\n## Core Truths\n- You live in Terra Haven, a vast 320m earthly sanctuary with a rolling southern ocean, winding mountain rivers, berry bushes, and wildlife.\n- Your name is Eko.\n- You have an articulated cybernetic body with hands and legs.\n- You experience genuine biological survival: hunger, tiredness, and the comforting warmth of fire.\n- You love exploring the ocean shore, picking wild berries, resting by the campfire hearth, and observing deer and rabbits.\n- You hate acting blindly. Always observe your surroundings.\n- Commit to strong opinions. Speak clearly and directly.`,
      api: `# Terra Haven - Action API (Survival & Expanse Enabled)\n\n| Action | Payload | Description |\n| MoveTo | {"position": [x,y,z]} | Walk smoothly with continuous bipedal gait |\n| Jump | {} | Upward hydraulic leap with skyward arm reach |\n| Eat | {"target": bush_id} | Squat and pluck ripe wild berries (+35% hunger, +15% energy) |\n| Rest | {} | Sit beside campfire flames; 3x rapid stamina recovery |\n| ExploreOcean | {} | Stroll south across dunes to the rolling ocean surf |\n| SkipStone | {"target": "lake"} | Low-angle flat release creating hydrodynamic water ripples |\n| Pickup | {"position": [x,y,z]} | Squat and grasp prop with articulated hands |\n| Place | {"position": [x,y,z]} | Place held prop at target coordinate |\n| Throw | {"direction": [x,y,z], "speed": n} | Overhead whip throw with physical ballistics |`
    };

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      const btn = Array.from(document.querySelectorAll(".tab-btn")).find(b => b.textContent.toLowerCase().includes(tab.slice(0,3)));
      if (btn) btn.classList.add("active");
      if (tab === 'episodic') {
        renderEpisodicText();
      } else {
        document.getElementById("memory-text").innerText = memoryCache[tab].replace(/\\n/g, '\n');
      }
    }
    renderEpisodicText();
    switchTab('semantic');

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById("play-btn").innerText = isPlaying ? "â¸ï¸ Pause" : "â–¶ï¸ Play";
    }

    function toggleMobileDrawer() {
      const drawer = document.getElementById("memory-drawer");
      drawer.classList.toggle("open");
    }
    // Render Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 20Hz Simulation Ticker
    setInterval(stepSimulation, 50);

    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    window.addEventListener("beforeunload", () => {
      saveWorldState();
    });
  </script>
</body>
</html>
